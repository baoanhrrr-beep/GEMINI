name: Jio Gemini Scanner Cloud 24/7 (Non-Stop)

on:
  schedule:
    # Tu dong bat may chu moi 30 phut de dam bao luon luon chay khong bao gio dung
    - cron: '*/30 * * * *'
  workflow_dispatch: # Cho phep bam nut Run workflow bang tay

concurrency:
  group: gemini-cloud-scanner
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: 1. Checkout ma nguon
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Cai dat Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 3. Cai dat thu vien can thiet
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Cau hinh Git Auto-Commit
        run: |
          git config --global user.name "Gemini Cloud Bot"
          git config --global user.email "bot@github-actions.internal"

      - name: 5. Chay Scanner lien tuc tren Cloud
        env:
          MAX_RUN_MINUTES: "300"  # Chay lien tuc 5 tieng moi phien
          PYTHONUNBUFFERED: "1"
        run: |
          python jio_gemini_share.py

      - name: 6. Day toan bo link moi ve GitHub
        if: always()
        run: |
          git add gemini_activation_links.txt gemini_links_fresh.txt gemini_links_used.txt gemini_results.csv 2>/dev/null || true
          if git status --porcelain | grep -q .; then
            git commit -m "Auto-sync links $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push
            echo "Da day toan bo link moi len GitHub thanh cong!"
          fi

      - name: 7. Tu dong kich hoat phien chay tiep theo (Chay vinh vien 24/7)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Kich hoat phien tiep theo de duy tri 24/7..."
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/gemini_scanner.yml/dispatches" \
            -d '{"ref":"main"}' || true
